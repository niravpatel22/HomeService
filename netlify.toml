# ============================================================================
# HomeServe Technologies — Root Netlify Configuration (netlify.toml)
# ============================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA Fallback Routing for React Router v6
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production HTTP Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

